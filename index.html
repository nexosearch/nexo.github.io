        title: "Supply and Demand",
        paragraphs: [
          "Supply and demand are the two core forces that determine prices and quantities in a market economy. Supply is how much producers offer, while demand is how much consumers want to buy.",
          "When demand rises while supply stays limited, buyers compete and prices tend to climb. Conversely, when supply exceeds demand, prices usually fall.",
          "At the market equilibrium price, the quantity that consumers want to purchase matches the quantity that producers are willing to sell."
        ]
      },
      {
        theme: "Economics",
        title: "What is Inflation?",
        paragraphs: [
          "Inflation is the general, sustained rise in the prices of goods and services across an economy over time.",
          "As average prices increase, each unit of currency buys slightly less than before, gradually reducing purchasing power.",
          "Central banks monitor inflation closely and use tools such as interest rates to keep prices predictable while supporting steady economic activity."
        ]
      },
      {
        theme: "Economics",
        title: "Compound Interest Explained",
        paragraphs: [
          "Unlike simple interest—which is calculated only on the original starting amount—compound interest is calculated on both the initial principal and the accumulated interest from earlier periods.",
          "Because interest earns additional interest over time, money saved or invested at a steady rate grows exponentially rather than in a straight line.",
          "For this reason, starting early and giving investments time to compound has a major impact on long-term financial growth."
        ]
      }
    ];

    const mainView = document.getElementById("main-view");
    const createPageView = document.getElementById("create-page-view");

    const nexoLogo = document.getElementById("nexo-logo");
    const createLogo = document.getElementById("create-logo");
    const searchForm = document.getElementById("search-form");
    const searchInput = document.getElementById("search-input");
    const searchResults = document.getElementById("search-results");
    const luckyBtn = document.getElementById("lucky-btn");
    const themeDropdown = document.getElementById("theme-dropdown");

    const signupForm = document.getElementById("signup-form");
    const signupNameInput = document.getElementById("signup-name-input");
    const signupStatus = document.getElementById("signup-status");

    const createWelcomeMsg = document.getElementById("create-welcome-msg");
    const createPageForm = document.getElementById("create-page-form");
    const pageTitleInput = document.getElementById("page-title-input");
    const pageTopicSelect = document.getElementById("page-topic-select");
    const pageContentInput = document.getElementById("page-content-input");
    const createPageStatus = document.getElementById("create-page-status");
    const backToNexoBtn = document.getElementById("back-to-nexo-btn");

    let currentAuthor = "";

    function normalizeText(str) {
      return str
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");
    }

    function escapeHTML(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    function filterData(query, selectedTheme) {
      const cleanQuery = normalizeText(query.trim());

      return nexoData.filter((item) => {
        const matchesTheme = !selectedTheme || item.theme === selectedTheme;
        if (!matchesTheme) return false;

        if (!cleanQuery) return true;

        const fullContent = normalizeText(
          `${item.theme} ${item.title} ${item.paragraphs.join(" ")}`
        );
        return cleanQuery.split(/\s+/).every((word) => fullContent.includes(word));
      });
    }

    function showResults(list, searchDescription) {
      searchInput.style.display = "none";
      searchResults.style.display = "block";

      let html = `
        <div class="results-header-info">
          <span>${escapeHTML(searchDescription)} (${list.length} result${list.length === 1 ? "" : "s"})</span>
          <button type="button" class="reset-link" onclick="showSearchBar()">New search</button>
        </div>
      `;

      if (list.length === 0) {
        html += `<p class="data-text">No information found for that query. Try another keyword or choose a topic from the dropdown.</p>`;
      } else {
        list.forEach((item) => {
          html += `
            <div class="data-item">
              <div class="data-title">${escapeHTML(item.title)}</div>
              <div class="data-theme">Topic: ${escapeHTML(item.theme)}${item.author ? " | Author: " + escapeHTML(item.author) : ""}</div>
              ${item.paragraphs.map((p) => `<p class="data-text">${escapeHTML(p)}</p>`).join("")}
            </div>
          `;
        });
      }

      searchResults.innerHTML = html;
      searchResults.scrollTop = 0;
    }

    function showSearchBar() {
      searchResults.style.display = "none";
      searchInput.style.display = "block";
      searchInput.value = "";
      themeDropdown.value = "";
      searchInput.focus();
    }

    function runNormalSearch() {
      const query = searchInput.value.trim();
      const theme = themeDropdown.value;
      const matches = filterData(query, theme);

      let desc = "Search results";
      if (query && theme) {
        desc = `Results for "${query}" in ${theme}`;
      } else if (query) {
        desc = `Results for "${query}"`;
      } else if (theme) {
        desc = `Topic: ${theme}`;
      } else {
        desc = "All available topics on Nexo";
      }

      showResults(matches, desc);
    }

    function openCreatePageScreen() {
      createWelcomeMsg.textContent = `Thank you, ${currentAuthor}! You are now signed up for Nexo.`;
      createPageStatus.textContent = "";

      mainView.style.display = "none";
      createPageView.style.display = "flex";
      pageTitleInput.focus();
    }

    function returnToMain() {
      createPageView.style.display = "none";
      mainView.style.display = "flex";
    }

    searchForm.addEventListener("submit", (e) => {
      e.preventDefault();
      if (searchInput.style.display === "none") {
        showSearchBar();
      } else {
        runNormalSearch();
      }
    });

    luckyBtn.addEventListener("click", () => {
      const query = searchInput.value.trim();
      const theme = themeDropdown.value;
      const matches = filterData(query, theme);

      if (matches.length === 0) {
        showResults([], `I'm feeling lucky${theme ? " (" + theme + ")" : ""}`);
        return;
      }

      const picked = matches[Math.floor(Math.random() * matches.length)];
      showResults([picked], `I'm feeling lucky — ${picked.theme}`);
    });

    // When changing the Dropdown, clear any previous search word so every topic shows its texts
    themeDropdown.addEventListener("change", () => {
      if (searchInput.style.display === "none") {
        searchInput.value = "";
        runNormalSearch();
      } else if (themeDropdown.value !== "") {
        runNormalSearch();
      }
    });

    nexoLogo.addEventListener("click", showSearchBar);
    createLogo.addEventListener("click", returnToMain);
    backToNexoBtn.addEventListener("click", returnToMain);

    // Sign-up handler -> stays on the page and shows confirmation + hyperlink
    signupForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const name = signupNameInput.value.trim();
      if (!name) {
        signupStatus.textContent = "Please enter your name to sign up.";
        signupNameInput.focus();
        return;
      }

      currentAuthor = name;
      signupNameInput.value = "";

      signupStatus.innerHTML = `
        Thank you, ${escapeHTML(name)}! You are now signed up for Nexo.<br>
        <a href="#" id="create-pages-link" class="create-page-link">Click here to create pages</a>
      `;

      document.getElementById("create-pages-link").addEventListener("click", (event) => {
        event.preventDefault();
        openCreatePageScreen();
      });
    });

    // Create Page handler -> adds the new page to Nexo's searchable data
    createPageForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const title = pageTitleInput.value.trim();
      const topic = pageTopicSelect.value;
      const rawContent = pageContentInput.value.trim();

      if (!title || !rawContent) {
        createPageStatus.textContent = "Please enter both a page title and page content.";
        return;
      }

      const paragraphs = rawContent
        .split(/\n+/)
        .map((line) => line.trim())
        .filter(Boolean);

      nexoData.unshift({
        theme: topic,
        title: title,
        author: currentAuthor,
        paragraphs: paragraphs
      });

      createPageStatus.textContent = `Page "${title}" was created in ${topic}! You can now search for it on Nexo.`;
      pageTitleInput.value = "";
      pageContentInput.value = "";
    });
  </script>
</body>
</html>
